<style>
/* VOICE: галасливий настільний вечір, трохи підступний

:root{--deep:#062a33;--sea:#0b4a57;--sand:#f3d9a4;--coral:#ff6a3d;--gold:#ffd166;--ink:#fff8ec;--muted:#b9d3d2;--card:#fff6e3;--cink:#2a1d12;color-scheme:dark}

#app{max-width:760px;margin:0 auto;padding:14px 14px 48px}

p{margin:.4em 0}.mut{color:var(--muted)}

.btn.y{background:var(--gold);color:#3b2307;box-shadow:0 4px 0 #b88a1d}
.btn.w{width:100%}.btn:disabled{opacity:.4;cursor:default}
.btn:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.panel{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:16px;margin:12px 0}
.hero{position:relative;border-radius:22px;overflow:hidden;margin-bottom:14px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.hero svg{display:block;width:100%;height:auto}

.res{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}

.acts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

.rul h3,details h3{margin:16px 0 6px;color:var(--gold)}.rul ul,.rul ol,details ul,details ol{padding-left:20px;margin:4px 0}.rul li,details li{margin:.35em 0}.sheet.rul{max-height:90vh}
.card .gv{min-height:36px;font-size:14px;margin-top:4px;background:#e9dcc3;color:#3b2a18}

.talkhint{background:rgba(255,209,102,.12);border-left:4px solid var(--gold);padding:10px 12px;border-radius:8px}
.tmr{font:400 44px "Russo One",sans-serif;text-align:center;color:var(--gold);margin-top:8px}
.ovr{background:rgba(0,0,0,.22);border-radius:14px;padding:10px;margin-top:10px}.ovn{display:flex;align-items:center;gap:8px;margin-bottom:8px}.ovn i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:800 12px Rubik;color:#fff;font-style:normal}.ovn small{color:var(--gold)}
.ovt{display:flex;flex-wrap:wrap;gap:6px}.pill{appearance:none;border:0;border-radius:99px;padding:8px 14px;min-height:40px;font:600 15px Rubik,sans-serif;background:rgba(255,255,255,.12);color:var(--ink);cursor:pointer}.pill.on{background:var(--coral);color:#fff}.pill.mg{margin-top:8px;width:100%}.pill.mg.on{background:var(--gold);color:#3b2307}

.chip.me{box-shadow:0 0 0 2px #fff inset}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#1b1b1b;color:#fff;padding:12px 18px;border-radius:14px;z-index:20;max-width:90vw;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.lost{position:sticky;top:0;z-index:15;background:#c0392b;color:#fff;padding:10px 14px;border-radius:12px;margin-bottom:10px;text-align:center}
.card .art{height:120px;margin:-10px -10px 2px;background:#e8d9b8 center/cover;border-radius:3px 3px 0 0}
.chip i.hp{background:#ddd center/cover;border:2px solid;width:28px;height:28px}
.big .av{background:#ddd center/cover;border:4px solid #fff;width:110px;height:110px}.big .av.gone{filter:grayscale(1) brightness(.7);border-color:#555}
.hcard{display:grid!important;grid-template-columns:64px 1fr;column-gap:12px;align-items:center}.hcard img{grid-row:span 2;width:64px;height:64px;border-radius:12px;object-fit:cover}
.heroes div img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;display:block;margin-bottom:6px}
.hero .bimg{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}.hero .t h1,.hero .t p{text-shadow:0 2px 6px rgba(0,0,0,.6)}
.mapbox{position:relative;border-radius:18px;overflow:hidden;margin:10px 0;box-shadow:0 8px 24px rgba(0,0,0,.35)}.mapbox img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}.mapbox span{position:absolute;left:12px;bottom:10px;background:rgba(0,0,0,.55);color:#fff;border-radius:99px;padding:4px 12px;font:400 16px "Russo One",sans-serif}
.resp{position:relative;overflow:hidden}
.sc{display:block;width:100%;max-width:420px;height:auto;margin:-4px auto 6px;border-radius:14px;background:linear-gradient(#bfe9f5,#e9f8fc)}
.wv{animation:wv 3s linear infinite}@keyframes wv{to{transform:translateX(40px)}}
.fj{transform-box:fill-box;opacity:0;animation:fj 1.1s cubic-bezier(.3,.7,.4,1) both}
@keyframes fj{0%{opacity:0;transform:translate(-20px,30px) rotate(50deg)}25%{opacity:1}55%{transform:translate(0,-60px) rotate(-20deg)}100%{opacity:1;transform:translate(10px,-28px) rotate(0)}}

.lvl{transform-box:fill-box;transform-origin:bottom;transform:scaleY(var(--l));animation:fill 2s ease-out both}@keyframes fill{from{transform:scaleY(0)}}
.sun{transform-box:fill-box;transform-origin:center;animation:spin 6s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.axe{transform-box:view-box;transform-origin:172px 96px;animation:chop .5s ease-in 3}@keyframes chop{0%{transform:rotate(-70deg)}80%{transform:rotate(4deg)}100%{transform:rotate(0)}}

.pop{transform-box:fill-box;transform-origin:center;animation:pop .4s cubic-bezier(.3,1.6,.5,1) both}@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.snk{animation:snk .7s .5s cubic-bezier(.3,1.5,.5,1) both}@keyframes snk{from{transform:translateY(80px);opacity:0}to{transform:none;opacity:1}}

.lid{transform-box:fill-box;transform-origin:left bottom;animation:lid .6s .2s ease-out both}@keyframes lid{to{transform:rotate(-28deg)}}

@keyframes flipin{0%{transform:translateY(-60px) rotateY(180deg) scale(.6);opacity:0}30%{opacity:1}100%{transform:none}}
@keyframes back{0%,45%{opacity:1}55%,100%{opacity:0}}

.gain{position:absolute;top:18px;right:18px;font:400 40px "Russo One",sans-serif;color:#fff;padding:2px 14px;border-radius:16px;animation:gain .6s 1s cubic-bezier(.3,1.6,.5,1) both;box-shadow:0 6px 16px rgba(0,0,0,.3)}.gain.f{background:#e8873a}.gain.z{background:#5f6b73}.gain.w{background:#2e86ab}.gain.d{background:#a0612f}

.r{position:relative}.r.up b{animation:bump .6s}.r.down b{animation:bumpd .6s}@keyframes bump{40%{transform:scale(1.45);color:#7dff9a}}@keyframes bumpd{40%{transform:scale(.7);color:#ff8a7a}}
.dlt{position:absolute;top:2px;right:6px;font:800 13px Rubik,sans-serif;font-style:normal;padding:1px 6px;border-radius:99px;animation:dlt 1.8s ease-out both}.dlt.p{background:#2f8f5b;color:#fff}.dlt.m{background:#c0392b;color:#fff}@keyframes dlt{0%{opacity:0;transform:translateY(8px)}20%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}

.bang{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:40;animation:bangbg 1.4s both}.bang b{font:400 72px "Russo One",sans-serif;color:#ffd166;text-shadow:0 4px 0 #8a3b12,0 0 30px #ff6a3d;animation:bangt 1.4s cubic-bezier(.3,1.6,.5,1) both}
@keyframes bangbg{0%{background:rgba(255,255,255,.9)}20%{background:rgba(255,80,40,.35)}100%{background:transparent}}@keyframes bangt{0%{transform:scale(0)}30%{transform:scale(1.2)}80%{opacity:1}100%{transform:scale(1);opacity:0}}
.hero{position:relative}.ovs{position:absolute;inset:0;width:100%;height:100%}

<h3>Про що гра</h3>
<p>Ваш корабель розбився, і ви застрягли на безлюдному острові. Ви всі в одній команді: треба разом зібрати дерево на пліт, запастися водою та їжею й відплисти до того, як прийде ураган.</p>
<p>Але є підступ: якщо води чи їжі не вистачає на всіх, табір голосує, кого вигнати. Тож ви ніби команда, але кожен трохи думає про себе. Перемагають ті, хто відплив на плоту.</p>

<h3>Підготовка</h3>
<ul><li>Грають від 3 до 12 людей на одному телефоні. Впишіть імена й натисніть «Почати гру».</li>
<li>Кожен отримує випадкового героя з особливою здібністю і одну випадкову карту-предмет.</li>
<li>На старті в таборі є трохи води та їжі, а дерева 0.</li></ul>

<h3>Що показано вгорі екрана</h3>
<ul><li><b>Вода</b> і <b>їжа</b>: спільні запаси всього табору.</li>
<li><b>Дерево</b>: те, що зібрано на пліт.</li>
<li><b>Місця</b>: кожні ${SEAT} дерева дають одне місце на плоту. Напис «2/4» означає, що місць 2, а живих гравців 4, тобто двоє поки не вміщаються.</li>
<li><b>Погода</b>: скільки води дасть дія «Набрати воду» в цьому раунді.</li>
<li>Біля імені видно героя гравця, а «хворий» означає, що він пропустить наступний хід.</li></ul>

<h3>Як іде раунд</h3>
<ol><li><b>Погода.</b> На початку раунду відкривається карта погоди: «сухо» (0 води) або дощ 1, 2 чи 3.</li>
<li><b>Ходи.</b> Гравці ходять по черзі. Гра показує, кому передати телефон. Цей гравець натискає «Я — …», і тоді бачить свої таємні карти. Іншим краще не підглядати.</li>
<li><b>Кінець раунду.</b> Коли всі походили, кожен живий гравець випиває 1 воду і з’їдає 1 їжу. Якщо не вистачає, починається голосування.</li>
<li>Наступний раунд починає наступний гравець за колом.</li></ol>

<h3>Що можна зробити у свій хід</h3>
<p>Спочатку можна зіграти скільки завгодно своїх карт. Потім обов’язково вибрати <b>одну</b> з чотирьох дій:</p>
<ul><li><b>Рибалити.</b> Ловиш від 0 до 3 їжі, як пощастить. Найчастіше 1–2.</li>
<li><b>Набрати воду.</b> Отримуєш стільки води, скільки показує погода. Коли сухо, нічого.</li>
<li><b>Рубати дерево.</b> Завжди даєш +1 дерево. Кнопкою «+» можна ризикнути й узяти ще до 5 колод: кожна дає +1 дерево. Але серед колод може сховатися змія, і чим більше береш, тим ризик вищий (видно у відсотках). Якщо змія вкусить, ти не отримаєш жодного дерева й пропустиш наступний хід.</li>
<li><b>Обшукати уламки.</b> Тягнеш одну карту. Це може бути предмет (іде тобі в руку) або подія (спрацьовує одразу, добра чи погана).</li></ul>

<h3>Хвороба</h3>
<p>Хворий гравець пропускає свій наступний хід: коли до нього дійде черга, він просто відпочиває. Після цього він здоровий. Захворіти можна від змії, лихоманки, отруйних ягід або підступної карти «Підстава». Вилікувати може «Аптечка» або подія «Вогнище».</p>

<h3>Карти</h3>
<p>Над назвою кожної карти написано, якого вона типу:</p>
<ul><li><b>Предмет · треба зіграти</b>: лежить у руці, поки ти не натиснеш «Зіграти» у свій хід. Після цього спрацьовує й зникає.</li>
<li><b>Предмет · діє сам</b>: нічого натискати не треба, карта допомагає, поки лежить у тебе (наприклад, сокира чи амулет).</li>
<li><b>Подія</b>: спрацьовує одразу, щойно ти витягнув її в уламках.</li></ul>
<p>Твої карти бачиш тільки ти. Можеш розповідати про них іншим, а можеш блефувати. Коли гравця виганяють, усі його карти пропадають.</p>
<p><b>Фляга</b> і <b>Консерва</b> особливі: це твій особистий запас. У кінці раунду вони самі напоять чи нагодують тебе, навіть коли спільний запас порожній. Тому з ними тебе не мусять виганяти через нестачу.</p>

<h3>Голосування</h3>
<ul><li>Починається, коли в кінці раунду води або їжі менше, ніж потрібно гравцям. Гра показує, скільки людей треба вигнати.</li>
<li>Кожен по черзі бере телефон і таємно вибирає, кого вигнати. За себе голосувати не можна.</li>
<li>Виганяють того, хто набрав найбільше голосів.</li>
<li><b>Нічия</b>: якщо в кількох однаково найбільше голосів, вирішує <b>ватажок</b> (той, хто першим ходив у цьому раунді; біля його імені жовта мітка «ватажок»). Він вибирає, кого з них вигнати, навіть якщо він сам серед них. Перед цим його можна вмовляти. Або всі разом можуть натиснути «Переголосувати».</li>
<li><b>Двоє гравців</b>: кожен голосує проти іншого, і виходить нічия. Тоді вирішує ватажок, тобто, по суті, вирішує той, хто цього раунду ходив першим. Тож ватажком бути вигідно, а перед кінцем гри варто думати, хто ним буде.</li>
<li><b>Хворі не голосують</b> у кінці раунду, але їх самих вигнати можна.</li>
<li>Ватажок змінюється щораунду: ним стає наступний гравець за колом. Якщо ватажка вигнали, роль переходить до наступного живого.</li>
<li>Вигнаний вибуває з гри, а решта знову перевіряє запаси. Якщо все ще не вистачає, голосують ще раз.</li>
<li><b>Мегафон</b> і герой <b>Хитрун</b> рахують голос за два. <b>Амулет вождя</b> й героїня <b>Дипломатка</b> можуть один раз урятувати від вигнання.</li>
<li>Перед голосуванням є <b>час розмов</b>: гра показує, чого бракує, і ви вголос домовляєтесь. Можна поставити таймер на 1–2 хвилини.</li>
<li>Під час розмов кожен може відкрити свої карти (кнопка «Подивитися свої карти»), віддати флягу, консерву чи інші припаси в табір або передати будь-яку карту іншому гравцю. Якщо після цього припасів вистачає, голосувати вже не треба.</li>
<li><b>Відкрите голосування</b> (як у настільній грі): на «раз, два, три» всі одночасно показують пальцем, а потім ви позначаєте в телефоні, хто на кого показав. <b>Таємне</b>: телефон передається по колу, і кожен голосує сам. Режим вибирається перед грою.</li>
<li>Говорити, домовлятися, підкуповувати картами, блефувати й не дотримувати обіцянок можна: у цьому вся гра.</li></ul>
<h3>Револьвер і патрони</h3><p>У колоді є 2 револьвери й 6 патронів. Маючи і револьвер, і патрон, можна вистрілити у свій хід або під час розмов перед голосуванням: вибраний гравець одразу вибуває з гри, а його карти пропадають. Постріл витрачає один патрон. Стріляти можна навіть тоді, коли припасів вистачає, тож револьвер це і погроза, і спосіб торгуватися: «віддай мені флягу, або…». Патрони можна передавати іншим або тримати в себе, щоб ніхто не вистрілив.</p>
<h3>Передати карту</h3><p>У свій хід під кожною картою є кнопка «Передати комусь». Карту можна віддати будь-кому живому, наприклад в обмін на голос чи обіцянку. Інші бачать у журналі, що ти щось передав, але не бачать, що саме.</p>
<h3>Гра з кількох телефонів</h3><p>Вгорі на стартовому екрані виберіть «Кожен зі свого телефона». Один гравець створює гру й отримує код із 4 літер. Інші вписують цей код і своє ім’я. Коли зібралося щонайменше 3 гравці, той, хто створив кімнату, натискає «Почати гру».</p><h3>Гра без інтернету</h3><p>Спершу кожен один раз відкриває гру з інтернетом, і вона зберігається на телефоні. Ведучий вмикає точку доступу Wi-Fi (мобільні дані не потрібні), інші підключаються до неї. Ведучий тисне «Створити без інтернету» й показує QR-код. Друг тисне «Приєднатися без інтернету», сканує код і показує свій. Ведучий сканує код друга, і так з кожним гравцем.</p><p>Кожен бачить свої карти тільки на своєму телефоні й ходить, коли настає його черга. Голосування таємне: кожен голосує зі свого телефона, а всі бачать лише підсумок. ${PEERMODE?'Реєструватися не треба. Телефон того, хто створив гру, працює як ведучий: усі інші підключаються до нього, тому на ньому не можна закривати сторінку й блокувати екран, поки йде гра. Якщо зв’язок обірвався, телефони самі перепідключаються.':'Для цього режиму кожен гравець має бути в своєму акаунті Claude, а власник гри має поділитися нею з ним із правом «Contributor».'} Кнопки «Назад» тут немає.</p>
<h3>Кнопка «↶ Назад»</h3><p>Скасовує останню дію, якщо хтось помилково натиснув не те. Домовтеся заздалегідь, коли нею можна користуватися, бо так можна й «перекинути» невдалий улов.</p>

<h3>Ураган</h3>
<p>Ураган це кінець гри. Його карта захована в колоді погоди, і він приходить у випадковий раунд, зазвичай між 7-м і 12-м. Точно ніхто не знає, коли саме.</p>
<ul><li>Коли на початку раунду відкривається ураган, вгорі з’являється червоний напис «Ураган! Останній раунд». Ви ще граєте цей раунд як звичайно.</li>
<li>Наприкінці цього раунду всі повинні сісти на пліт. Спершу кожен п’є й їсть, як завжди. А потім на кожного, хто сідає, потрібне одне місце на плоту, плюс ще одна вода й одна їжа на дорогу.</li>
<li>Якщо місць чи припасів не вистачає на всіх, табір голосує, хто залишиться на острові, доки решта не вміститься.</li>
<li>Ті, хто сів на пліт, перемагають. Ті, хто залишився, програють. Якщо плоту немає взагалі, програють усі.</li>
<li>Дізнатися, коли прийде ураган, допомагають підзорна труба, пляшка з запискою, папуга й герой Скаут. Відкласти його може барометр.</li></ul>

<h3>Як можна виграти раніше</h3>

<h3>Поради</h3>
<ul><li>Не всім рубати дерево: без води та їжі табір почне голосувати вже в перших раундах.</li>

  else if(st.step==='noscan')b=`<h3>Тут сканер не працює</h3><p>${host?'Відкрий звичайну камеру телефона (або Google Lens) і наведи на код друга. Відкриється сторінка гри, вона сама передасть код сюди. Потім повернись у цю вкладку.':'Відкрий звичайну камеру телефона й наведи на QR-код ведучого. Відкриється гра із запрошенням: впиши ім’я й натисни «Приєднатися без інтернету».'}</p>`;
  else if(st.step==='nocam')b=`<h3>Немає доступу до камери</h3><p>Дозволь грі користуватися камерою в налаштуваннях браузера й спробуй ще раз.</p><button class="btn y w" data-a="${host?'lscan':'lre'}">Спробувати ще</button>`;
  else if(st.step==='fail')b=`<h3>Не вийшло</h3><p>${st.msg}</p>${st.retry?`<button class="btn y w" data-a="${st.retry}" style="margin-top:8px">Спробувати ще раз</button>`:''}`;
  LQ.el.innerHTML=`<div class="lqb"><div class="lqs">${b}${cancel}</div></div>`}
function lqClose(cancel){stopCam();clearTimeout(LQ.cto);if(cancel&&LQ.pend&&LQ.pend.connectionState!=='connected'){try{LQ.pend.close()}catch(e){}LQ.pend=null}
  LQ.st=null;if(LQ.el){LQ.el.remove();LQ.el=null}}
async function lqScan(onText){lqShow({step:'scan'});
  let det=null;try{if('BarcodeDetector' in window){const f=await BarcodeDetector.getSupportedFormats();if(f.includes('qr_code'))det=new BarcodeDetector({formats:['qr_code']})}}catch(e){}
  if(!det)return lqShow({step:'noscan'});
  stopCam();try{LQ.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}})}catch(e){return lqShow({step:'nocam'})}
  const v=LQ.el&&LQ.el.querySelector('video');if(!v)return stopCam();v.srcObject=LQ.stream;try{await v.play()}catch(e){}
  const tick=async()=>{if(!LQ.stream||!LQ.st||LQ.st.step!=='scan')return;
    try{const r=await det.detect(v),t=r.map(x=>x.rawValue).find(s=>s&&s.includes('Z1~'));if(t){stopCam();return onText(t)}}catch(e){}
    LQ.timer=setTimeout(tick,200)};tick()}
Object.assign(ONL,{
  lcreate(){const nm=(document.getElementById('oname')||{}).value?.trim();if(!nm)return say('Впиши своє ім’я');setup.myname=nm;wake();localHost(null);ONL.ladd()},
  ljoin(){const nm=(document.getElementById('oname')||{}).value?.trim();if(!nm)return say('Впиши своє ім’я');setup.myname=nm;wake();
    ONLINE={code:'LOCAL',local:true,me:-1,seq:0,host:false,slow:false};LOB=null;S=null;render();
    if(PENDO){const t=PENDO;PENDO=null;return lJoinWith(t)}ONL.lre()},
  lre(){if(!ONLINE||!ONLINE.local)return;lqScan(t=>lJoinWith(t))},
  async ladd(){if(!ONLINE||!ONLINE.host)return;lqShow({step:'busy',msg:'Готую запрошення…'});
    try{const t=await lOffer();lqShow({step:'offer',url:lurl(t)})}catch(e){console.error(e);lqShow({step:'fail',msg:'Не вдалося створити запрошення: '+(e&&e.message||e),retry:'ladd'})}},
  lscan(){lqScan(t=>lAccept(t))},
  lclose(){lqClose(true)}});
/* Посилання з QR-коду: запрошення (o) відкриває гру з готовим входом; відповідь (a) передається у вкладку ведучого */
(()=>{const h=decodeURIComponent(location.hash||'');if(!h.includes('Z1~'))return;const x=unpackSDP(h);
  try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}
  if(!x)return;
  if(x.kind==='o'){PENDO=h.slice(h.indexOf('Z1~'));mode='many'}
  else{RELAY=true;const t=h.slice(h.indexOf('Z1~'));try{new BroadcastChannel('akzub-local').postMessage(t)}catch(e){}try{localStorage.setItem('akzub-relay',t+'|'+Date.now())}catch(e){}setTimeout(()=>{try{window.close()}catch(e){}},1500)}})();
const lRelay=t=>{if(!RELAY&&ONLINE&&ONLINE.local&&ONLINE.host&&LQ.pend&&LQ.last!==t){LQ.last=t;stopCam();lAccept(t)}};
try{new BroadcastChannel('akzub-local').onmessage=e=>lRelay(String(e.data))}catch(e){}
window.addEventListener('storage',e=>{if(e.key==='akzub-relay'&&e.newValue)lRelay(e.newValue.split('|')[0])});

function checkOff(){try{caches.open('akzub-v1').then(c=>c.match('videos/win.mp4')).then(r=>{if(!!r!==OFFOK){OFFOK=!!r;render()}}).catch(()=>{})}catch(e){}}
if(PEERMODE&&'serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
  navigator.serviceWorker.addEventListener('message',e=>{if(e.data==='akzub-cached')checkOff()});checkOff()}
const offNote=()=>!PEERMODE||!('serviceWorker' in navigator)?'':OFFOK?'<p class="offok">✅ Гра збережена на телефоні й відкриється без інтернету.</p>':'<p class="offok mut">Зберігаю гру на телефон, щоб вона відкривалась без інтернету…</p>';

const NOH=new Set(['undo','rules','quit','again','start','tm']);
app.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;let a=b.dataset.a,v0=b.dataset.v;
  if(a==='mute'){muted=!muted;try{localStorage.setItem('shark-mute',muted?'1':'0')}catch(e){}return render()}
  sfx('tap');
  if(a==='cno'){conf=null;return render()}

  else if(b.dataset.c){conf={a,v:v0,m:b.dataset.c};return render()}
  const f=ACT[a];const bv={dataset:{v:v0}};
  if(a==='mode'){mode=v0;return render()}
  if(ONLINE&&ONL[a])return ONL[a](v0);
  if(!ONLINE&&mode==='many'&&ONL[a]&&!S)return ONL[a](v0);
  if(!f)return;
  if(ONLINE&&!LOCAL.has(a))return send(a,v0);
  const before=S&&!NOH.has(a)?JSON.stringify(S):null;f(v0);
  if(a==='start'||a==='quit'||a==='again')hist=[];
  if(before&&S&&JSON.stringify(S)!==before){hist.push(before);if(hist.length>60)hist.shift();render()}});
app.addEventListener('input',e=>{if(e.target.dataset.i!=null)setup.names[+e.target.dataset.i]=e.target.value});
try{render()}catch(err){app.innerHTML='<p style="padding:20px;color:#fff">Помилка: '+esc(err&&err.message||err)+'. Натисни «Скинути»</p><button class="btn" id="rst">Скинути</button>';try{localStorage.removeItem('shark-tooth')}catch(e){}document.getElementById('rst').onclick=()=>location.reload()}
if(PEERMODE){try{const hs=JSON.parse(localStorage.getItem('shark-host')||'null'),cl=JSON.parse(localStorage.getItem('shark-online')||'null');
  if(RELAY){}else if(hs&&hs.code==='LOCAL'){mode='many';setTimeout(()=>localHost(hs),0)}else if(hs&&hs.code){mode='many';setTimeout(()=>peerHost(hs.code,hs),0)}else if(PENDO){}else if(cl&&cl.code){mode='many';setup.myname=cl.name;setTimeout(()=>peerJoin(cl.code),0)}}catch(e){}}
(async()=>{try{if(!window.claude||!window.claude.use)return;DB=await window.claude.use('db');const us=await window.claude.use('user');UID=us?await us.id():null;
