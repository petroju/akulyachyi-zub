const RULES_BODY=`
<h3>Про що гра</h3>
<p>Ваш корабель розбився, і ви застрягли на безлюдному острові. Ви всі в одній команді: треба разом зібрати дерево на пліт, запастися водою та їжею й відплисти до того, як прийде ураган.</p>
<p>Але є підступ: якщо води чи їжі не вистачає на всіх, табір голосує, кого вигнати. Тож ви ніби команда, але кожен трохи думає про себе. Перемагають ті, хто відплив на плоту.</p>

<h3>Підготовка</h3>
<ul><li>Грають від 3 до 12 людей на одному телефоні. Впишіть імена й натисніть «Почати гру».</li>
<li>Кожен отримує випадкового героя з особливою здібністю і одну випадкову карту-предмет.</li>
<li>На старті в таборі є трохи води та їжі, а дерева 0.</li></ul>

<h3>Що показано вгорі екрана</h3>
<ul><li><b>Вода</b> і <b>їжа</b>: спільні запаси всього табору.</li>
<li><b>Дерево</b>: те, що зібрано на пліт.</li>
<li><b>Місця</b>: кожні ${SEAT} дерева дають одне місце на плоту. Напис «2/4» означає, що місць 2, а живих гравців 4, тобто двоє поки не вміщаються.</li>
<li><b>Погода</b>: скільки води дасть дія «Набрати воду» в цьому раунді.</li>
<li>Біля імені видно героя гравця, а «хворий» означає, що він пропустить наступний хід.</li></ul>

<h3>Як іде раунд</h3>
<ol><li><b>Погода.</b> На початку раунду відкривається карта погоди: «сухо» (0 води) або дощ 1, 2 чи 3.</li>
<li><b>Ходи.</b> Гравці ходять по черзі. Гра показує, кому передати телефон. Цей гравець натискає «Я — …», і тоді бачить свої таємні карти. Іншим краще не підглядати.</li>
<li><b>Кінець раунду.</b> Коли всі походили, кожен живий гравець випиває 1 воду і з’їдає 1 їжу. Якщо не вистачає, починається голосування.</li>
<li>Наступний раунд починає наступний гравець за колом.</li></ol>

<h3>Що можна зробити у свій хід</h3>
<p>Спочатку можна зіграти скільки завгодно своїх карт. Потім обов’язково вибрати <b>одну</b> з чотирьох дій:</p>
<ul><li><b>Рибалити.</b> Ловиш від 0 до 3 їжі, як пощастить. Найчастіше 1–2.</li>
<li><b>Набрати воду.</b> Отримуєш стільки води, скільки показує погода. Коли сухо, нічого.</li>
<li><b>Рубати дерево.</b> Завжди даєш +1 дерево. Кнопкою «+» можна ризикнути й узяти ще до 5 колод: кожна дає +1 дерево. Але серед колод може сховатися змія, і чим більше береш, тим ризик вищий (видно у відсотках). Якщо змія вкусить, ти не отримаєш жодного дерева й пропустиш наступний хід.</li>
<li><b>Обшукати уламки.</b> Тягнеш одну карту. Це може бути предмет (іде тобі в руку) або подія (спрацьовує одразу, добра чи погана).</li></ul>

<h3>Хвороба</h3>
<p>Хворий гравець пропускає свій наступний хід: коли до нього дійде черга, він просто відпочиває. Після цього він здоровий. Захворіти можна від змії, лихоманки, отруйних ягід або підступної карти «Підстава». Вилікувати може «Аптечка» або подія «Вогнище».</p>

<h3>Карти</h3>
<p>Над назвою кожної карти написано, якого вона типу:</p>
<ul><li><b>Предмет · треба зіграти</b>: лежить у руці, поки ти не натиснеш «Зіграти» у свій хід. Після цього спрацьовує й зникає.</li>
<li><b>Предмет · діє сам</b>: нічого натискати не треба, карта допомагає, поки лежить у тебе (наприклад, сокира чи амулет).</li>
<li><b>Подія</b>: спрацьовує одразу, щойно ти витягнув її в уламках.</li></ul>
<p>Твої карти бачиш тільки ти. Можеш розповідати про них іншим, а можеш блефувати. Коли гравця виганяють, усі його карти пропадають.</p>
<p><b>Фляга</b> і <b>Консерва</b> особливі: це твій особистий запас. У кінці раунду вони самі напоять чи нагодують тебе, навіть коли спільний запас порожній. Тому з ними тебе не мусять виганяти через нестачу.</p>

<h3>Голосування</h3>
<ul><li>Починається, коли в кінці раунду води або їжі менше, ніж потрібно гравцям. Гра показує, скільки людей треба вигнати.</li>
<li>Кожен по черзі бере телефон і таємно вибирає, кого вигнати. За себе голосувати не можна.</li>
<li>Виганяють того, хто набрав найбільше голосів.</li>
<li><b>Нічия</b>: якщо в кількох однаково найбільше голосів, вирішує <b>ватажок</b> (той, хто першим ходив у цьому раунді; біля його імені жовта мітка «ватажок»). Він вибирає, кого з них вигнати, навіть якщо він сам серед них. Перед цим його можна вмовляти. Або всі разом можуть натиснути «Переголосувати».</li>
<li><b>Двоє гравців</b>: кожен голосує проти іншого, і виходить нічия. Тоді вирішує ватажок, тобто, по суті, вирішує той, хто цього раунду ходив першим. Тож ватажком бути вигідно, а перед кінцем гри варто думати, хто ним буде.</li>
<li><b>Хворі не голосують</b> у кінці раунду, але їх самих вигнати можна.</li>
<li>Ватажок змінюється щораунду: ним стає наступний гравець за колом. Якщо ватажка вигнали, роль переходить до наступного живого.</li>
<li>Вигнаний вибуває з гри, а решта знову перевіряє запаси. Якщо все ще не вистачає, голосують ще раз.</li>
<li><b>Мегафон</b> і герой <b>Хитрун</b> рахують голос за два. <b>Амулет вождя</b> й героїня <b>Дипломатка</b> можуть один раз урятувати від вигнання.</li>
<li>Перед голосуванням є <b>час розмов</b>: гра показує, чого бракує, і ви вголос домовляєтесь. Можна поставити таймер на 1–2 хвилини.</li>
<li>Під час розмов кожен може відкрити свої карти (кнопка «Подивитися свої карти»), віддати флягу, консерву чи інші припаси в табір або передати будь-яку карту іншому гравцю. Якщо після цього припасів вистачає, голосувати вже не треба.</li>
<li><b>Відкрите голосування</b> (як у настільній грі): на «раз, два, три» всі одночасно показують пальцем, а потім ви позначаєте в телефоні, хто на кого показав. <b>Таємне</b>: телефон передається по колу, і кожен голосує сам. Режим вибирається перед грою.</li>
<li>Говорити, домовлятися, підкуповувати картами, блефувати й не дотримувати обіцянок можна: у цьому вся гра.</li></ul>
<h3>Револьвер і патрони</h3><p>У колоді є 2 револьвери й 6 патронів. Маючи і револьвер, і патрон, можна вистрілити у свій хід або під час розмов перед голосуванням: вибраний гравець одразу вибуває з гри, а його карти пропадають. Постріл витрачає один патрон. Стріляти можна навіть тоді, коли припасів вистачає, тож револьвер це і погроза, і спосіб торгуватися: «віддай мені флягу, або…». Патрони можна передавати іншим або тримати в себе, щоб ніхто не вистрілив.</p>
<h3>Передати карту</h3><p>У свій хід під кожною картою є кнопка «Передати комусь». Карту можна віддати будь-кому живому, наприклад в обмін на голос чи обіцянку. Інші бачать у журналі, що ти щось передав, але не бачать, що саме.</p>
<h3>Гра з кількох телефонів</h3><p>Вгорі на стартовому екрані виберіть «Кожен зі свого телефона». Один гравець створює гру й отримує код із 4 літер. Інші вписують цей код і своє ім’я. Коли зібралося щонайменше 3 гравці, той, хто створив кімнату, натискає «Почати гру».</p><p>Кожен бачить свої карти тільки на своєму телефоні й ходить, коли настає його черга. Голосування таємне: кожен голосує зі свого телефона, а всі бачать лише підсумок. ${PEERMODE?'Реєструватися не треба. Телефон того, хто створив гру, працює як ведучий: усі інші підключаються до нього, тому на ньому не можна закривати сторінку й блокувати екран, поки йде гра. Якщо зв’язок обірвався, телефони самі перепідключаються.':'Для цього режиму кожен гравець має бути в своєму акаунті Claude, а власник гри має поділитися нею з ним із правом «Contributor».'} Кнопки «Назад» тут немає.</p>
<h3>Кнопка «↶ Назад»</h3><p>Скасовує останню дію, якщо хтось помилково натиснув не те. Домовтеся заздалегідь, коли нею можна користуватися, бо так можна й «перекинути» невдалий улов.</p>

<h3>Ураган</h3>
<p>Ураган це кінець гри. Його карта захована в колоді погоди, і він приходить у випадковий раунд, зазвичай між 7-м і 12-м. Точно ніхто не знає, коли саме.</p>
<ul><li>Коли на початку раунду відкривається ураган, вгорі з’являється червоний напис «Ураган! Останній раунд». Ви ще граєте цей раунд як звичайно.</li>
<li>Наприкінці цього раунду всі повинні сісти на пліт. Спершу кожен п’є й їсть, як завжди. А потім на кожного, хто сідає, потрібне одне місце на плоту, плюс ще одна вода й одна їжа на дорогу.</li>
<li>Якщо місць чи припасів не вистачає на всіх, табір голосує, хто залишиться на острові, доки решта не вміститься.</li>
<li>Ті, хто сів на пліт, перемагають. Ті, хто залишився, програють. Якщо плоту немає взагалі, програють усі.</li>
<li>Дізнатися, коли прийде ураган, допомагають підзорна труба, пляшка з запискою, папуга й герой Скаут. Відкласти його може барометр.</li></ul>

<h3>Як можна виграти раніше</h3>
<p>Якщо в кінці будь-якого раунду (після того, як усі поїли й попили) місць на плоту вистачає всім живим, а води та їжі в таборі лишилось ще хоча б по одній на кожного (на дорогу), гра запропонує відплисти. Натискаєте «Відпливаємо!», і всі, хто живий, перемагають. Можна й залишитися ще на раунд.</p>

<h3>Поради</h3>
<ul><li>Не всім рубати дерево: без води та їжі табір почне голосувати вже в перших раундах.</li>
<li>Коли дощ 2–3, вигідно набирати воду. Коли сухо, краще рибалити або рубати.</li>
<li>Ризикувати на дереві найкраще на початку, коли пропущений хід ще не так страшно.</li>
<li>Фляга й консерва в руці це ваша страховка від вигнання. Подумайте, чи віддавати їх табору.</li></ul>`;

    h=`<div class="hero">${heroArt}<div class="t"><h1>Акулячий Зуб</h1><p style="color:#fff;max-width:26ch">Пліт, ураган і чесні друзі. Поки вистачає їжі.</p></div></div>

    h=bar()+islandBoard()+`<div class="panel">${eatScene()}<h2>Кінець раунду ${S.round}</h2>${S.notes.map(n=>`<p>${n}</p>`).join('')}<p>Усі напилися й поїли. До плоту бракує: ${Math.max(0,alive().length-seats())} місць.</p><button class="btn w" data-a="nround" style="margin-top:12px">Наступний раунд</button></div>`;
  } else if(S.scr==='depart'){
    h=bar()+islandBoard()+`<div class="panel big"><h2>Пліт готовий!</h2><p>Місць, води та їжі вистачає на всіх ${alive().length}. Відпливаєте?</p><button class="btn y w" data-a="sail" style="margin-top:14px">Відпливаємо!</button><button class="btn g w" data-a="nround" style="margin-top:10px">Ще раунд на острові</button></div>`;
  } else if(S.scr==='over'){
    h=overHTML();
  }
  if(S&&sheet){const hp=holder();let opts,title,act;
    if(sheet.give){opts=S.players.map((q,i)=>[q,i]).filter(([q])=>q.alive&&q!==hp);title=`Кому передати «${C[sheet.give][0]}»?`;act='gto'}
    else{const k=sheet.k;opts=S.players.map((q,i)=>[q,i]).filter(([q])=>q.alive&&(C[k][4]==='sick'?q.sick:q!==hp));title=`${C[k][0]}: на кого?`;act='tgt'}
    h+=`<div class="ov"><div class="sheet"><h3>${title}</h3><div class="tg" style="margin-top:12px">${opts.length?opts.map(([q,i])=>`<button class="btn" data-a="${act}" data-v="${i}" data-c="${sheet.give?`Передати «${C[sheet.give][0]}» гравцю ${esc(q.name)}?`:sheet.k==='gun'?`Вистрілити в ${esc(q.name)}? Це не можна скасувати.`:`«${C[sheet.k][0]}» на гравця ${esc(q.name)}?`}">${esc(q.name)}</button>`).join(''):'<p>Немає підходящих гравців.</p>'}<button class="btn g" data-a="close">Скасувати</button></div></div></div>`}
  if(conf)h+=`<div class="ov"><div class="sheet conf"><h3>${conf.m}</h3><div class="row" style="margin-top:14px"><button class="btn g" data-a="cno">Ні</button><button class="btn y" data-a="cyes">Так</button></div></div></div>`;
  if(showRules)h+=`<div class="ov"><div class="sheet rul"><div class="top"><h2>Правила</h2><button class="btn g" data-a="rules">Закрити</button></div>${RULES_BODY}${RULES_MODES}<h3 style="margin-top:12px">Герої</h3><div class="heroes">${Object.entries(HER).map(([k,x])=>`<div><img src="${pic('h_'+k)}" alt=""><b>${x[0]}</b>${x[1]}</div>`).join('')}</div></div></div>`;
  if(ONLINE&&ONLINE.lost)h=`<div class="lost">Зв’язок із ведучим втрачено, перепідключаюсь…</div>`+h;
  if(S){const fx=S.fxn||0;if(seenFx===null)seenFx=fx;else if(fx>seenFx){bangUntil=Date.now()+2600;sfx('bang');setTimeout(()=>render(),2700)}seenFx=fx}else seenFx=null;
  if(Date.now()<bangUntil)h+=`<div class="bang"><div class="bangv">${vid('shot','scv')}</div><b>БАХ!</b></div>`;
  if(toast)h+=`<div class="toast">${esc(toast)}</div>`;
  app.innerHTML=h;
  if(S&&prevRes){['water','food','wood'].forEach((k,i)=>{const d=dv(k);if(d){const el=app.querySelectorAll('.res .r')[i];if(el)burst(el,d>0?['#7dff9a','#ffd166','#fff']:['#ff8a7a','#c0392b']);sfx(d>0?'up':'down')}})}
  if(S)prevRes={water:S.water,food:S.food,wood:S.wood,g:S.players.length+'|'+S.players[0].name};else prevRes=null;
}
const NOH=new Set(['undo','rules','quit','again','start','tm']);
app.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;let a=b.dataset.a,v0=b.dataset.v;
  if(a==='mute'){muted=!muted;try{localStorage.setItem('shark-mute',muted?'1':'0')}catch(e){}return render()}
  sfx('tap');
  if(a==='cno'){conf=null;return render()}
  if(a==='cyes'){if(!conf)return;a=conf.a;v0=conf.v;conf=null}
  else if(b.dataset.c){conf={a,v:v0,m:b.dataset.c};return render()}
  const f=ACT[a];const bv={dataset:{v:v0}};
  if(a==='mode'){mode=v0;return render()}
  if(ONLINE&&ONL[a])return ONL[a](v0);
  if(!ONLINE&&mode==='many'&&ONL[a]&&!S)return ONL[a](v0);
  if(!f)return;
  if(ONLINE&&!LOCAL.has(a))return send(a,v0);
  const before=S&&!NOH.has(a)?JSON.stringify(S):null;f(v0);
  if(a==='start'||a==='quit'||a==='again')hist=[];
  if(before&&S&&JSON.stringify(S)!==before){hist.push(before);if(hist.length>60)hist.shift();render()}});
app.addEventListener('input',e=>{if(e.target.dataset.i!=null)setup.names[+e.target.dataset.i]=e.target.value});
try{render()}catch(err){app.innerHTML='<p style="padding:20px;color:#fff">Помилка: '+esc(err&&err.message||err)+'. Натисни «Скинути»</p><button class="btn" id="rst">Скинути</button>';try{localStorage.removeItem('shark-tooth')}catch(e){}document.getElementById('rst').onclick=()=>location.reload()}
if(PEERMODE){try{const hs=JSON.parse(localStorage.getItem('shark-host')||'null'),cl=JSON.parse(localStorage.getItem('shark-online')||'null');
  if(hs&&hs.code){mode='many';setTimeout(()=>peerHost(hs.code,hs),0)}else if(cl&&cl.code){mode='many';setup.myname=cl.name;setTimeout(()=>peerJoin(cl.code),0)}}catch(e){}}
(async()=>{try{if(!window.claude||!window.claude.use)return;DB=await window.claude.use('db');const us=await window.claude.use('user');UID=us?await us.id():null;
  if(DB&&UID){let c=null;try{c=localStorage.getItem('shark-online')}catch(e){}if(c){mode='many';connect(c)}}render()}catch(e){}})();
try{const l=document.createElement('link');l.rel='stylesheet';l.href='https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;800&family=Russo+One&display=swap';document.head.appendChild(l)}catch(e){}
}
</script>
</body></html>
