<!DOCTYPE html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Акулячий Зуб</title>
<style>
/* VOICE: галасливий настільний вечір, трохи підступний
   IDEA: коробка настільної гри — ігрове поле, карти, жетони
   PICTURE: острів на заході сонця з вулканом, пальмою і плотом
   COLOUR and TYPE: глибоке море, пісок, кораловий акцент; Russo One + Rubik
   LAYOUT: одна колонка під телефон, ресурси вгорі, дії великими плитками */
:root{--deep:#062a33;--sea:#0b4a57;--sand:#f3d9a4;--coral:#ff6a3d;--gold:#ffd166;--ink:#fff8ec;--muted:#b9d3d2;--card:#fff6e3;--cink:#2a1d12;color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:radial-gradient(140% 70% at 50% 0%,#11606f,var(--deep) 70%) fixed;color:var(--ink);font:16px/1.5 Rubik,system-ui,sans-serif;min-height:100vh;overflow-x:clip}
#app{max-width:760px;margin:0 auto;padding:14px 14px 48px}
h1,h2,h3{font-family:"Russo One",Rubik,sans-serif;font-weight:400;line-height:1.05;margin:0;text-wrap:balance}
h1{font-size:clamp(36px,10vw,52px);color:var(--gold);text-shadow:0 3px 0 #8a3b12}
h2{font-size:clamp(24px,6.5vw,32px)}h3{font-size:20px}
p{margin:.4em 0}.mut{color:var(--muted)}
.btn{appearance:none;border:0;border-radius:14px;padding:12px 18px;min-height:48px;font:600 16px Rubik,sans-serif;cursor:pointer;background:var(--coral);color:#fff;box-shadow:0 4px 0 #a83a17;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #a83a17}
.btn.g{background:rgba(255,255,255,.12);box-shadow:none;color:var(--ink)}
.btn.y{background:var(--gold);color:#3b2307;box-shadow:0 4px 0 #b88a1d}
.btn.w{width:100%}.btn:disabled{opacity:.4;cursor:default}
.btn:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.panel{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:16px;margin:12px 0}
.hero{position:relative;border-radius:22px;overflow:hidden;margin-bottom:14px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.hero svg{display:block;width:100%;height:auto}
.hero .t{position:absolute;left:18px;top:14px;right:18px}
.res{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.r{background:rgba(0,0,0,.28);border-radius:14px;padding:8px 4px;text-align:center}
.r svg{width:28px;height:28px;display:block;margin:0 auto}
.r b{font:800 22px Rubik;display:block;line-height:1.2}.r small{color:var(--muted);font-size:13px;white-space:nowrap}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}.top .btn{white-space:nowrap}.top>span:last-child{margin-left:auto}
.tag{background:rgba(0,0,0,.3);border-radius:99px;padding:4px 12px;font-size:14px;white-space:nowrap}
.tag.h{background:#c0392b;animation:pulse 1.2s infinite}
@keyframes pulse{50%{background:#7a1f15}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.25);border-radius:99px;padding:4px 10px 4px 4px;font-size:14px}
.chip i{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:800 12px Rubik;color:#fff;font-style:normal}
.chip.dead{opacity:.4;text-decoration:line-through}.chip.now{outline:2px solid var(--gold)}
.acts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.act{appearance:none;border:0;border-radius:18px;padding:14px 10px;min-height:120px;cursor:pointer;color:var(--cink);background:var(--sand);box-shadow:0 5px 0 #b3915a;font:600 15px Rubik,sans-serif;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.act svg{width:44px;height:44px}.act b{font:400 18px "Russo One",Rubik,sans-serif}.act span{font-size:13px;opacity:.8;line-height:1.3}
.act:active{transform:translateY(3px);box-shadow:0 2px 0 #b3915a}
.risk{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:4px}
.risk button{width:36px;height:36px;border-radius:50%;border:0;background:#a0612f;color:#fff;font:800 18px Rubik;cursor:pointer}
.hand{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{background:var(--card);color:var(--cink);border-radius:14px;padding:10px 10px 12px;border-top:10px solid var(--c);box-shadow:0 4px 12px rgba(0,0,0,.3);display:flex;flex-direction:column;gap:6px;animation:deal .35s ease-out}
.card h3{font-size:17px}.card p{font-size:14px;line-height:1.4;margin:0;flex:1}.card .kd{font-size:12px;font-weight:600;text-transform:none;color:var(--c);filter:brightness(.7)}
.card .btn{min-height:40px;padding:8px;font-size:15px}
.card .pas{font-size:13px;color:#6b5a45;font-style:italic}
@keyframes deal{from{transform:translateY(12px) rotate(-3deg);opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
.big{text-align:center;padding:26px 16px}
.big .av{width:84px;height:84px;border-radius:50%;margin:8px auto 14px;display:grid;place-items:center;font:400 36px "Russo One",sans-serif;color:#fff;box-shadow:0 0 0 6px rgba(255,255,255,.12)}
.wcard{display:flex;gap:14px;align-items:center;background:linear-gradient(135deg,#d7eef5,#9fd0e0);color:#0b3440;border-radius:18px;padding:14px}
.wcard.h{background:linear-gradient(135deg,#3a1d2e,#c0392b);color:#fff}
.wcard svg{width:64px;height:64px;flex:none}
.log{font-size:14px;color:var(--muted);margin:0;padding-left:18px}
.names{display:grid;gap:8px}
.nm{display:flex;gap:8px}.nm input{flex:1;font:16px Rubik,sans-serif;padding:12px;border-radius:12px;border:0;background:var(--card);color:var(--cink);min-height:48px}
.nm button{width:48px;border-radius:12px;border:0;background:rgba(255,255,255,.12);color:var(--ink);font-size:20px;cursor:pointer}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1 1 140px}
.tg{display:grid;gap:8px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sheet{background:var(--sea);width:min(760px,100%);border-radius:22px 22px 0 0;padding:18px 16px 26px;max-height:85vh;overflow:auto}
details summary{cursor:pointer;font-weight:600;min-height:44px;display:flex;align-items:center}
details li{margin:.3em 0}
.vote{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.vote .btn{background:#26535d;box-shadow:0 4px 0 #0e2f36}
.sel{outline:3px solid var(--gold)}
.hcard{display:flex;flex-direction:column;gap:2px;background:var(--card);color:var(--cink);border-left:8px solid var(--c);border-radius:14px;padding:10px 14px;margin-bottom:12px}.hcard b{font:400 18px "Russo One",Rubik,sans-serif}.hcard span{font-size:14px;line-height:1.35}
.heroes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:10px}.heroes div{background:rgba(0,0,0,.25);border-radius:12px;padding:8px 10px;font-size:14px;line-height:1.35}.heroes b{display:block;color:var(--gold)}
.rul h3,details h3{margin:16px 0 6px;color:var(--gold)}.rul ul,.rul ol,details ul,details ol{padding-left:20px;margin:4px 0}.rul li,details li{margin:.35em 0}.sheet.rul{max-height:90vh}
.card .gv{min-height:36px;font-size:14px;margin-top:4px}
.need{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}.need div{display:flex;align-items:center;gap:6px;background:rgba(192,57,43,.35);border-radius:12px;padding:6px 12px}.need svg{width:24px;height:24px}.need b{font-size:20px}
.talkhint{background:rgba(255,209,102,.12);border-left:4px solid var(--gold);padding:10px 12px;border-radius:8px}
.tmr{font:400 44px "Russo One",sans-serif;text-align:center;color:var(--gold);margin-top:8px}
.ovr{background:rgba(0,0,0,.22);border-radius:14px;padding:10px;margin-top:10px}.ovn{display:flex;align-items:center;gap:8px;margin-bottom:8px}.ovn i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:800 12px Rubik;color:#fff;font-style:normal}.ovn small{color:var(--gold)}
.ovt{display:flex;flex-wrap:wrap;gap:6px}.pill{appearance:none;border:0;border-radius:99px;padding:8px 14px;min-height:40px;font:600 15px Rubik,sans-serif;background:rgba(255,255,255,.12);color:var(--ink);cursor:pointer}.pill.on{background:var(--coral);color:#fff}.pill.mg{margin-top:8px;width:100%}.pill.mg.on{background:var(--gold);color:#3b2307}
.ld{background:var(--gold);color:#3b2307;border-radius:99px;padding:0 7px;font-size:12px;margin-left:2px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:rgba(0,0,0,.3);border-radius:16px;padding:5px;margin:0 0 4px}.seg button{appearance:none;border:0;border-radius:12px;min-height:46px;font:600 15px Rubik,sans-serif;background:transparent;color:var(--ink);cursor:pointer}.seg button.on{background:var(--gold);color:#3b2307}
.chip.me{box-shadow:0 0 0 2px #fff inset}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#1b1b1b;color:#fff;padding:12px 18px;border-radius:14px;z-index:20;max-width:90vw;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.lost{position:sticky;top:0;z-index:15;background:#c0392b;color:#fff;padding:10px 14px;border-radius:12px;margin-bottom:10px;text-align:center}
.win{font-size:clamp(28px,8vw,44px)}
</style></head><body>
<div id="app"><p style="padding:24px;font:16px sans-serif;color:#fff8ec">Завантаження гри…</p></div>
<script>
{
const SEAT=5, FISH=[0,1,1,2,2,3];
const COLS=['#e4572e','#2e86ab','#7fb069','#a23b72','#f18f01','#5c4d7d','#3bb273','#d1495b','#00798c','#edae49','#8d6a9f','#6c8ead'];
const IC={
w:'<svg viewBox="0 0 24 24"><path d="M12 2C8 8 5 11 5 15a7 7 0 0014 0c0-4-3-7-7-13z" fill="#4cc3ff"/><path d="M8.5 15a3.5 3.5 0 003.5 3.5" stroke="#fff" stroke-width="1.6" fill="none" opacity=".7"/></svg>',
f:'<svg viewBox="0 0 24 24"><path d="M2 12c3-5 9-6 13-3l6-3-1.5 6 1.5 6-6-3c-4 3-10 2-13-3z" fill="#ffa24c"/><path d="M11 9q2 3 0 6" stroke="#c96a1a" fill="none"/><circle cx="6.5" cy="11" r="1.3" fill="#2a1d12"/></svg>',
d:'<svg viewBox="0 0 24 24"><rect x="2" y="8" width="18" height="8" rx="4" fill="#a0612f"/><path d="M5 10.5h9M7 13.5h8" stroke="#7a451c"/><ellipse cx="19.5" cy="12" rx="2.6" ry="4" fill="#e3b27a"/><ellipse cx="19.5" cy="12" rx="1" ry="1.8" fill="#a0612f"/></svg>',
s:'<svg viewBox="0 0 24 24"><path d="M2 16h20l-2 4H4z" fill="#c98a4b"/><path d="M6 16v4M10 16v4M14 16v4M18 16v4" stroke="#8a5a2b"/><path d="M12 2v14" stroke="#e3d2b0" stroke-width="1.5"/><path d="M12.8 3l7 10.5h-7z" fill="#fff6e3"/></svg>',
c:'<svg viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="12" rx="2" fill="#8a5a2b"/><path d="M3 12h18M10 8v12" stroke="#5e3a17" stroke-width="1.5"/><rect x="2" y="5" width="20" height="4" rx="1" fill="#b77a3d"/><circle cx="12" cy="14" r="1.6" fill="#ffd166"/></svg>'};
const wIcon=v=>v==='H'?'<svg viewBox="0 0 64 64"><path d="M32 8a24 24 0 1024 24" stroke="#fff" stroke-width="5" fill="none"/><path d="M32 18a14 14 0 1014 14" stroke="#ffd166" stroke-width="5" fill="none"/><circle cx="32" cy="32" r="5" fill="#fff"/></svg>':
 `<svg viewBox="0 0 64 64">${v===0?'<circle cx="32" cy="30" r="14" fill="#ffb627"/>':''}<path d="M16 40a9 9 0 010-18 12 12 0 0123-3 9 9 0 019 21z" fill="${v?'#fff':'#ffffffaa'}"/>${Array.from({length:v},(_,i)=>`<path d="M${22+i*10} 46l-3 8" stroke="#2e86ab" stroke-width="3" stroke-linecap="round"/>`).join('')}</svg>`;
const C={
flask:['Фляга','i','#3aa7d8','Твоя особиста вода. Тримай у руці: у кінці раунду вона напоїть тебе замість спільної води, тож тебе не доведеться виганяти через спрагу. Або натисни «Зіграти», щоб віддати її табору: +2 води для всіх.','pool',{w:2}],
can:['Консерва','i','#e8873a','Твоя особиста їжа. Тримай у руці: у кінці раунду вона нагодує тебе замість спільної їжі. Або натисни «Зіграти», щоб віддати її табору: +2 їжі для всіх.','pool',{f:2}],
coconut:['Кокос','i','#7a5a3a','Натисни «Зіграти»: кокос іде в спільний запас, табір отримує +1 воду і +1 їжу.','pool',{w:1,f:1}],
net:['Рибальська сітка','i','#e8873a','Натисни «Зіграти»: сіткою виловлюєш багато риби, табір отримує +3 їжі.','pool',{f:3}],
rope:['Канат','i','#a0612f','Натисни «Зіграти»: канатом в’яжеш колоди, пліт отримує +2 дерева.','pool',{d:2}],
sail:['Вітрило','i','#a0612f','Натисни «Зіграти»: пришиваєш вітрило до плоту, це рахується як +4 дерева.','pool',{d:4}],
axe:['Сокира','i','#5f6b73','Грати не треба, діє сама, поки лежить у тебе. Коли вибираєш дію «Рубати дерево» і змія не кусає, отримуєш ще +2 дерева.'],
rod:['Вудка','i','#5f6b73','Грати не треба, діє сама. Коли рибалиш, гра ловить двічі й залишає тобі кращий улов. Наприклад, випало 0 і 2, то отримаєш 2.'],
bucket:['Відро','i','#5f6b73','Грати не треба, діє сама. Коли вибираєш «Набрати воду», отримуєш на 1 воду більше, ніж показує погода.'],
antidote:['Протиотрута','i','#2f8f5b','Грати не треба, діє сама. Якщо тебе вкусить змія (коли рубаєш дерево чи в уламках), протиотрута спрацює, і ти не захворієш. Після цього карта зникає.'],
amulet:['Амулет вождя','i','#b8860b','Грати не треба, діє сама. Якщо на голосуванні табір вирішить вигнати саме тебе, амулет тріскає, і ти лишаєшся в грі. Тоді виганяють того, хто набрав голосів наступним. Карта зникає.'],
megaphone:['Мегафон','i','#b8860b','Не грається в свій хід. Під час голосування з’явиться кнопка «Увімкнути мегафон»: тоді твій голос рахується за два. Після цього карта зникає.'],
medkit:['Аптечка','i','#d6455d','Натисни «Зіграти» й вибери хворого гравця (можна себе). Він одразу одужує й не пропустить свій хід.','sick'],
thief:['Спритні руки','i','#6b4ca8','Натисни «Зіграти» й вибери гравця. Ти навмання забираєш одну карту з його руки собі. Він дізнається, що в нього щось зникло.','other'],
swap:['Обмін долею','i','#6b4ca8','Натисни «Зіграти» й вибери гравця. Ви повністю міняєтеся всіма картами в руці: його карти стають твоїми, а твої його.','other'],
map:['Стара карта','i','#b8860b','Натисни «Зіграти»: ти одразу обшукуєш уламки ще двічі, тобто тягнеш дві карти. Це окрім твоєї звичайної дії.','self'],
spyglass:['Підзорна труба','i','#3a6fa8','Натисни «Зіграти»: ти бачиш погоду на наступні два раунди. Наприклад, «дощ 2, сухо» або «УРАГАН». Можеш сказати іншим або збрехати.','self'],
barometer:['Барометр','i','#3a6fa8','Натисни «Зіграти»: ураган прийде на один раунд пізніше, ніж мав. Це дає табору ще один раунд, щоб добудувати пліт.','self'],
trap:['Пастка для крабів','i','#e8873a','Натисни «Зіграти»: пастка ставиться на березі й лишається там до кінця гри. Наприкінці кожного раунду вона приносить табору +1 їжу (у пастку лізуть краби).','self'],
native:['Тубілець','i','#a0612f','Натисни «Зіграти»: до табору приходить тубілець. Він забирає 1 їжу зі спільного запасу й натомість дає 3 дерева для плоту.','self'],
treasure:['Карта скарбів','i','#b8860b','Натисни «Зіграти»: за картою ти знаходиш скарб і одразу тягнеш три карти з уламків. Це окрім твоєї звичайної дії.','self'],
dance:['Танець дощу','i','#3aa7d8','Натисни «Зіграти»: наступного раунду погода буде щонайменше дощ 2, тож воду набирати буде легше. Ураган танцем не скасувати.','self'],
betray:['Підстава','i','#6b4ca8','Натисни «Зіграти» й вибери гравця. Ти потай підсипаєш йому щось у їжу, і він захворіє: пропустить свій наступний хід. Інші не знають, що це ти.','other'],
spy:['Підслухати','i','#6b4ca8','Натисни «Зіграти» й вибери гравця. Ти бачиш усі карти в його руці. Він не знає, що ти підглядав.','other'],
spear:['Спис','i','#5f6b73','Грати не треба, діє сама. Коли рибалиш і ловиш хоча б одну рибу, спис додає ще +1 їжу.'],
catcher:['Збирач дощу','i','#3aa7d8','Натисни «Зіграти»: збирач ставиться на березі до кінця гри. Наприкінці кожного раунду, коли йде дощ, він додає табору +1 воду. Коли сухо, нічого.','self'],
spring:['Джерело','e','#3aa7d8','Подія, спрацьовує одразу. Ти знаходиш у скелях прісне джерело, табір отримує +3 води.',{w:3}],
turtle:['Черепаха','e','#e8873a','Подія, спрацьовує одразу. На березі величезна черепаха, табір отримує +2 їжі.',{f:2}],
banana:['Банани','e','#e8873a','Подія, спрацьовує одразу. Ти знаходиш гроно стиглих бананів, табір отримує +2 їжі.',{f:2}],
crabs:['Краби','e','#e8873a','Подія, спрацьовує одразу. Ти ловиш кількох крабів, табір отримує +1 їжу.',{f:1}],
planks:['Дошки з корабля','e','#a0612f','Подія, спрацьовує одразу. Хвиля винесла дошки з корабля, пліт отримує +3 дерева.',{d:3}],
rain:['Злива','e','#3aa7d8','Подія, спрацьовує одразу. Раптова злива наповнила бочки, табір отримує +2 води.',{w:2}],

function nextRound(){

  S.order=[];for(let i=0;i<n;i++){const j=(s+i)%n;if(P(j).alive)S.order.push(j)}

}

function draw(p,out,depth=0){

}

function endRound(){
  S.notes=[];
  if(S.traps){S.food+=S.traps;S.notes.push(`Пастки для крабів: +${S.traps} їжі`)}
  if(S.catchers&&S.weather>0){S.water+=S.catchers;S.notes.push(`Збирачі дощу: +${S.catchers} води`)}
  resolve();
}
function resolve(){
  const {al,short}=lack();
  if(short>0){
    if(short>=al.length)return over(false);
    S.scr='talk';return;
  }
  al.forEach(p=>{if(has(p,'flask'))take(p,'flask');else S.water--;if(hero(p,'cook'));else if(has(p,'can'))take(p,'can');else S.food--});
  if(S.final)return over(true);
  const a=al.length;
  S.scr=(seats()>=a&&S.water>=a&&S.food>=a)?'depart':'sum';
}
function leader(){const n=S.players.length;let s=S.start;for(let k=0;k<n&&!P(s).alive;k++)s=(s+1)%n;return s}
function trySave(i,ex){const p=P(i),v=S.vote;
  if((p.shield||has(p,'amulet'))&&v.cands.some(j=>j!==i&&!ex.includes(j)&&P(j).alive)){
    if(p.shield){p.shield=false;v.notes.push(`Дипломатка ${p.name} переконала табір її залишити!`)}else{take(p,'amulet');v.notes.push(`Амулет вождя врятував ${p.name}!`)}
    ex.push(i);return true}
  return false}
function tally(ex=[]){
  const v=S.vote;
  for(let g=0;g<50;g++){
    const c=v.cands.filter(i=>P(i).alive&&!ex.includes(i)&&v.votes[i]);
    let pool;
    if(c.length){const m=Math.max(...c.map(i=>v.votes[i]));pool=c.filter(i=>v.votes[i]===m)}
    else{pool=v.cands.filter(i=>P(i).alive&&!ex.includes(i));if(!pool.length)pool=v.cands.filter(i=>P(i).alive)}
    if(pool.length>1){S.tie={pool,ex};S.scr='tie';return}
    if(trySave(pool[0],ex))continue;
    return eliminate(pool[0]);
  }
}
function eliminate(out){const v=S.vote,p=P(out);p.alive=false;p.hand=[];log(`${p.name} вигнали з табору`);
  S.verdict={i:out,n:v.votes[out]||0,notes:v.notes,tab:v.cands.map(i=>[P(i).name,v.votes[i]||0])};S.scr='verdict'}
function over(win){S.scr='over';S.win=win&&alive().length>0}

const RULES_BODY=`
<h3>Про що гра</h3>
<p>Ваш корабель розбився, і ви застрягли на безлюдному острові. Ви всі в одній команді: треба разом зібрати дерево на пліт, запастися водою та їжею й відплисти до того, як прийде ураган.</p>
<p>Але є підступ: якщо води чи їжі не вистачає на всіх, табір голосує, кого вигнати. Тож ви ніби команда, але кожен трохи думає про себе. Перемагають ті, хто відплив на плоту.</p>

<h3>Підготовка</h3>
<ul><li>Грають від 3 до 12 людей на одному телефоні. Впишіть імена й натисніть «Почати гру».</li>
<li>Кожен отримує випадкового героя з особливою здібністю і одну випадкову карту-предмет.</li>
<li>На старті в таборі є трохи води та їжі, а дерева 0.</li></ul>

<h3>Що показано вгорі екрана</h3>
<ul><li><b>Вода</b> і <b>їжа</b>: спільні запаси всього табору.</li>
<li><b>Дерево</b>: те, що зібрано на пліт.</li>
<li><b>Місця</b>: кожні ${SEAT} дерева дають одне місце на плоту. Напис «2/4» означає, що місць 2, а живих гравців 4, тобто двоє поки не вміщаються.</li>
<li><b>Погода</b>: скільки води дасть дія «Набрати воду» в цьому раунді.</li>
<li>Біля імені видно героя гравця, а «хворий» означає, що він пропустить наступний хід.</li></ul>

<h3>Як іде раунд</h3>
<ol><li><b>Погода.</b> На початку раунду відкривається карта погоди: «сухо» (0 води) або дощ 1, 2 чи 3.</li>
<li><b>Ходи.</b> Гравці ходять по черзі. Гра показує, кому передати телефон. Цей гравець натискає «Я — …», і тоді бачить свої таємні карти. Іншим краще не підглядати.</li>
<li><b>Кінець раунду.</b> Коли всі походили, кожен живий гравець випиває 1 воду і з’їдає 1 їжу. Якщо не вистачає, починається голосування.</li>
<li>Наступний раунд починає наступний гравець за колом.</li></ol>

<h3>Що можна зробити у свій хід</h3>
<p>Спочатку можна зіграти скільки завгодно своїх карт. Потім обов’язково вибрати <b>одну</b> з чотирьох дій:</p>
<ul><li><b>Рибалити.</b> Ловиш від 0 до 3 їжі, як пощастить. Найчастіше 1–2.</li>
<li><b>Набрати воду.</b> Отримуєш стільки води, скільки показує погода. Коли сухо, нічого.</li>
<li><b>Рубати дерево.</b> Завжди даєш +1 дерево. Кнопкою «+» можна ризикнути й узяти ще до 5 колод: кожна дає +1 дерево. Але серед колод може сховатися змія, і чим більше береш, тим ризик вищий (видно у відсотках). Якщо змія вкусить, ти не отримаєш жодного дерева й пропустиш наступний хід.</li>
<li><b>Обшукати уламки.</b> Тягнеш одну карту. Це може бути предмет (іде тобі в руку) або подія (спрацьовує одразу, добра чи погана).</li></ul>

<h3>Хвороба</h3>
<p>Хворий гравець пропускає свій наступний хід: коли до нього дійде черга, він просто відпочиває. Після цього він здоровий. Захворіти можна від змії, лихоманки, отруйних ягід або підступної карти «Підстава». Вилікувати може «Аптечка» або подія «Вогнище».</p>

<h3>Карти</h3>
<p>Над назвою кожної карти написано, якого вона типу:</p>
<ul><li><b>Предмет · треба зіграти</b>: лежить у руці, поки ти не натиснеш «Зіграти» у свій хід. Після цього спрацьовує й зникає.</li>
<li><b>Предмет · діє сам</b>: нічого натискати не треба, карта допомагає, поки лежить у тебе (наприклад, сокира чи амулет).</li>
<li><b>Подія</b>: спрацьовує одразу, щойно ти витягнув її в уламках.</li></ul>
<p>Твої карти бачиш тільки ти. Можеш розповідати про них іншим, а можеш блефувати. Коли гравця виганяють, усі його карти пропадають.</p>
<p><b>Фляга</b> і <b>Консерва</b> особливі: це твій особистий запас. У кінці раунду вони самі напоять чи нагодують тебе, навіть коли спільний запас порожній. Тому з ними тебе не мусять виганяти через нестачу.</p>

<h3>Голосування</h3>
<ul><li>Починається, коли в кінці раунду води або їжі менше, ніж потрібно гравцям. Гра показує, скільки людей треба вигнати.</li>
<li>Кожен по черзі бере телефон і таємно вибирає, кого вигнати. За себе голосувати не можна.</li>
<li>Виганяють того, хто набрав найбільше голосів.</li>
<li><b>Нічия</b>: якщо в кількох однаково найбільше голосів, вирішує <b>ватажок</b> (той, хто першим ходив у цьому раунді; біля його імені жовта мітка «ватажок»). Він вибирає, кого з них вигнати, навіть якщо він сам серед них. Перед цим його можна вмовляти. Або всі разом можуть натиснути «Переголосувати».</li>
<li><b>Двоє гравців</b>: кожен голосує проти іншого, і виходить нічия. Тоді вирішує ватажок, тобто, по суті, вирішує той, хто цього раунду ходив першим. Тож ватажком бути вигідно, а перед кінцем гри варто думати, хто ним буде.</li>
<li><b>Хворі не голосують</b> у кінці раунду, але їх самих вигнати можна.</li>
<li>Ватажок змінюється щораунду: ним стає наступний гравець за колом. Якщо ватажка вигнали, роль переходить до наступного живого.</li>
<li>Вигнаний вибуває з гри, а решта знову перевіряє запаси. Якщо все ще не вистачає, голосують ще раз.</li>
<li><b>Мегафон</b> і герой <b>Хитрун</b> рахують голос за два. <b>Амулет вождя</b> й героїня <b>Дипломатка</b> можуть один раз урятувати від вигнання.</li>
<li>Перед голосуванням є <b>час розмов</b>: гра показує, чого бракує, і ви вголос домовляєтесь. Можна поставити таймер на 1–2 хвилини.</li>
<li>Під час розмов кожен може відкрити свої карти (кнопка «Подивитися свої карти»), віддати флягу, консерву чи інші припаси в табір або передати будь-яку карту іншому гравцю. Якщо після цього припасів вистачає, голосувати вже не треба.</li>
<li><b>Відкрите голосування</b> (як у настільній грі): на «раз, два, три» всі одночасно показують пальцем, а потім ви позначаєте в телефоні, хто на кого показав. <b>Таємне</b>: телефон передається по колу, і кожен голосує сам. Режим вибирається перед грою.</li>
<li>Говорити, домовлятися, підкуповувати картами, блефувати й не дотримувати обіцянок можна: у цьому вся гра.</li></ul>
<h3>Передати карту</h3><p>У свій хід під кожною картою є кнопка «Передати комусь». Карту можна віддати будь-кому живому, наприклад в обмін на голос чи обіцянку. Інші бачать у журналі, що ти щось передав, але не бачать, що саме.</p>
<h3>Гра з кількох телефонів</h3><p>Вгорі на стартовому екрані виберіть «Кожен зі свого телефона». Один гравець створює гру й отримує код із 4 літер. Інші вписують цей код і своє ім’я. Коли зібралося щонайменше 3 гравці, той, хто створив кімнату, натискає «Почати гру».</p><p>Кожен бачить свої карти тільки на своєму телефоні й ходить, коли настає його черга. Голосування таємне: кожен голосує зі свого телефона, а всі бачать лише підсумок. ${PEERMODE?'Реєструватися не треба. Телефон того, хто створив гру, працює як ведучий: усі інші підключаються до нього, тому на ньому не можна закривати сторінку й блокувати екран, поки йде гра. Якщо зв’язок обірвався, телефони самі перепідключаються.':'Для цього режиму кожен гравець має бути в своєму акаунті Claude, а власник гри має поділитися нею з ним із правом «Contributor».'} Кнопки «Назад» тут немає.</p>
<h3>Кнопка «↶ Назад»</h3><p>Скасовує останню дію, якщо хтось помилково натиснув не те. Домовтеся заздалегідь, коли нею можна користуватися, бо так можна й «перекинути» невдалий улов.</p>

<h3>Ураган</h3>
<p>Ураган це кінець гри. Його карта захована в колоді погоди, і він приходить у випадковий раунд, зазвичай між 7-м і 12-м. Точно ніхто не знає, коли саме.</p>
<ul><li>Коли на початку раунду відкривається ураган, вгорі з’являється червоний напис «Ураган! Останній раунд». Ви ще граєте цей раунд як звичайно.</li>
<li>Наприкінці цього раунду всі повинні сісти на пліт. Спершу кожен п’є й їсть, як завжди. А потім на кожного, хто сідає, потрібне одне місце на плоту, плюс ще одна вода й одна їжа на дорогу.</li>
<li>Якщо місць чи припасів не вистачає на всіх, табір голосує, хто залишиться на острові, доки решта не вміститься.</li>
<li>Ті, хто сів на пліт, перемагають. Ті, хто залишився, програють. Якщо плоту немає взагалі, програють усі.</li>
<li>Дізнатися, коли прийде ураган, допомагають підзорна труба, пляшка з запискою, папуга й герой Скаут. Відкласти його може барометр.</li></ul>

<h3>Як можна виграти раніше</h3>
<p>Якщо в кінці будь-якого раунду (після того, як усі поїли й попили) місць на плоту вистачає всім живим, а води та їжі в таборі лишилось ще хоча б по одній на кожного (на дорогу), гра запропонує відплисти. Натискаєте «Відпливаємо!», і всі, хто живий, перемагають. Можна й залишитися ще на раунд.</p>

<h3>Поради</h3>
<ul><li>Не всім рубати дерево: без води та їжі табір почне голосувати вже в перших раундах.</li>
<li>Коли дощ 2–3, вигідно набирати воду. Коли сухо, краще рибалити або рубати.</li>
<li>Ризикувати на дереві найкраще на початку, коли пропущений хід ще не так страшно.</li>
<li>Фляга й консерва в руці це ваша страховка від вигнання. Подумайте, чи віддавати їх табору.</li></ul>`;

    try{await DB.doc('games/'+code).set({lobby:{host:UID,players:[{uid:UID,name:nm}]},state:null,seq:1})}catch(e){return say(e&&e.code==='invalid_argument'?'Немає дозволу створювати гру: власник має поділитися з тобою як «Contributor».':'Не вдалося створити гру.')}
    connect(code)},
  async ojoin(){const nm=(document.getElementById('oname')||{}).value?.trim(),code=((document.getElementById('ocode')||{}).value||'').trim().toUpperCase();
    if(!nm)return say('Впиши своє ім’я');if(!/^[A-Z]{4}$/.test(code))return say('Код це 4 літери');setup.myname=nm;
    if(!DB){wake();return peerJoin(code)}
    await connect(code);for(let k=0;k<40&&ONLINE&&!LOB;k++)await sleep(250);if(ONLINE&&LOB)send('ojoin2')},
  ojoin2(){send('ojoin2')},
  ostart(){wake();send('ostart')},
  oleave(){leave()},
  quit(){leave()},
  again(){send('again')},
  myvote(t){send('myvote',t)},
  copy(){try{navigator.clipboard.writeText(location.href.split('#')[0]).then(()=>say('Посилання скопійовано'),()=>say('Скопіюй адресу сторінки вручну'))}catch(e){say('Скопіюй адресу сторінки вручну')}}
};

  } else if(S.scr==='pickwho'){

const NOH=new Set(['undo','rules','quit','again','start','tm']);
app.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const a=b.dataset.a,f=ACT[a];
  if(a==='mode'){mode=b.dataset.v;return render()}
  if(ONLINE&&ONL[a])return ONL[a](b.dataset.v);
  if(!ONLINE&&mode==='many'&&ONL[a]&&!S)return ONL[a](b.dataset.v);
  if(!f)return;
  if(ONLINE&&!LOCAL.has(a))return send(a,b.dataset.v);
  const before=S&&!NOH.has(a)?JSON.stringify(S):null;f(b.dataset.v);
  if(a==='start'||a==='quit'||a==='again')hist=[];
  if(before&&S&&JSON.stringify(S)!==before){hist.push(before);if(hist.length>60)hist.shift();render()}});
app.addEventListener('input',e=>{if(e.target.dataset.i!=null)setup.names[+e.target.dataset.i]=e.target.value});
try{render()}catch(err){app.innerHTML='<p style="padding:20px;color:#fff">Помилка: '+esc(err&&err.message||err)+'. Натисни «Скинути»</p><button class="btn" id="rst">Скинути</button>';try{localStorage.removeItem('shark-tooth')}catch(e){}document.getElementById('rst').onclick=()=>location.reload()}
if(PEERMODE){try{const hs=JSON.parse(localStorage.getItem('shark-host')||'null'),cl=JSON.parse(localStorage.getItem('shark-online')||'null');
  if(hs&&hs.code){mode='many';setTimeout(()=>peerHost(hs.code,hs),0)}else if(cl&&cl.code){mode='many';setup.myname=cl.name;setTimeout(()=>peerJoin(cl.code),0)}}catch(e){}}
(async()=>{try{if(!window.claude||!window.claude.use)return;DB=await window.claude.use('db');const us=await window.claude.use('user');UID=us?await us.id():null;
  if(DB&&UID){let c=null;try{c=localStorage.getItem('shark-online')}catch(e){}if(c){mode='many';connect(c)}}render()}catch(e){}})();
try{const l=document.createElement('link');l.rel='stylesheet';l.href='https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;800&family=Russo+One&display=swap';document.head.appendChild(l)}catch(e){}
}
