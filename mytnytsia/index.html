<style>

@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translate(30px,-105vh);opacity:0}}
.gull{position:absolute;width:30px;height:10px;opacity:.5;animation:gull 28s linear infinite}@keyframes gull{from{transform:translateX(110vw)}to{transform:translateX(-60px) translateY(-30px)}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden}.confetti i{position:absolute;top:-12px;width:8px;height:12px;border-radius:2px;animation:conf linear forwards}@keyframes conf{to{transform:translateY(105vh) rotate(720deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.card.spec{border-color:#7a3fb0}.card.spec .cb{background:linear-gradient(#3a1d5a,#24123a);color:#f3e6ff}.card.spec small{color:#d9c2ff}.card.spec .v{background:radial-gradient(#d6a6ff,#7a3fb0);color:#fff}

.st-t{font-size:13px}.st-t td,.st-t th{text-align:center;padding:6px 3px}
.awards{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.aw{background:linear-gradient(160deg,rgba(242,181,68,.22),rgba(0,0,0,.25));border:1px solid rgba(242,181,68,.4);border-radius:16px;padding:10px;text-align:center;animation:awin .6s cubic-bezier(.3,1.5,.5,1) both}
.aw .ai{font-size:28px;line-height:1}.aw b{display:block;font:400 16px Kurale,serif;color:var(--gold);margin-top:4px}.aw span{display:block;font-weight:700}.aw small{color:var(--mut);font-size:12px}
@keyframes awin{from{transform:translateY(20px) scale(.8);opacity:0}}

<script>
{
/* ===== Дані ===== */
// key: [назва, ціна, штраф, легальний, король, королева, кількість, колір, рахується як (рідкісні)]
const G={
apple:['Яблука',2,2,1,20,10,48,'#c0392b'],cheese:['Сир',3,2,1,15,10,36,'#e6b800'],bread:['Хліб',3,2,1,15,10,36,'#b5793a'],fish:['Риба',4,2,1,10,5,24,'#2e86ab'],
spice:['Прянощі',6,4,0,0,0,22,'#8e44ad'],rum:['Ром',7,4,0,0,0,21,'#6d4c41'],silk:['Шовк',8,4,0,0,0,12,'#d35400'],powder:['Порох',9,4,0,0,0,5,'#34495e'],
rapple:['Золоте яблуко',8,4,0,0,0,3,'#e2b23a','apple'],rcheese:['Королівський сир',10,5,0,0,0,3,'#e2b23a','cheese'],rbread:['Святковий коровай',10,5,0,0,0,3,'#e2b23a','bread'],rfish:['Царський осетер',11,5,0,0,0,3,'#e2b23a','fish']};
const LEGAL=['apple','cheese','bread','fish'],CONTRA=Object.keys(G).filter(k=>!G[k][3]);
const ROYAL=['rapple','rcheese','rbread','rfish'],PLAIN=['spice','rum','silk','powder'];

if(PEERMODE){try{UID=localStorage.getItem('myt-uid')}catch(e){}if(!UID){UID='p'+Math.random().toString(36).slice(2,12);try{localStorage.setItem('myt-uid',UID)}catch(e){}}}
const LOCAL=new Set(['tog','pile','rules','undo','dealopen','dealclose','dg','dk','mode','add','del','cno','mute','opt']);
function doAct(a,v,loc){
  if(a==='join'){if(!LOB)return false;const nm=String(loc.name||'Гравець').slice(0,14);const x=LOB.players.find(q=>q.uid===ACTOR);if(x){x.name=nm;return}if(S||LOB.players.length>=6)return false;LOB.players.push({uid:ACTOR,name:nm});return}
  if(a==='lopt'){if(!LOB||LOB.host!==ACTOR||S||!OPTS.some(o=>o[0]===v))return false;LOB.opts=LOB.opts||{...setup.opts};LOB.opts[v]=!LOB.opts[v];return}
  if(a==='ostart'){if(LOB.host!==ACTOR||LOB.players.length<3||S)return false;newGame(LOB.players.map(q=>q.name),LOB.opts);S.players.forEach((q,i)=>q.uid=LOB.players[i].uid);S.online=true;S.scr='round';return}
  if(a==='again'){if(!S||S.scr!=='over')return false;S=null;return}
  if(!S)return false;ONLINE.me=S.players.findIndex(q=>q.uid===ACTOR);
  if(['begin','endround'].includes(a)&&ONLINE.me!==S.sheriff)return false;
  const f=ACT[a];if(!f)return false;return f(v)}
const stateMsg=()=>({t:'state',lobby:LOB,state:S,seq:ONLINE.seq});
function broadcast(){const m=stateMsg();CONNS.forEach(c=>{try{c.open&&c.send(m)}catch(e){}})}
function persistHost(){try{localStorage.setItem('myt-host',JSON.stringify({code:ONLINE.code,lobby:LOB,state:S,seq:ONLINE.seq}))}catch(e){}}
function hostApply(uid,a,v,loc){const before=JSON.stringify([LOB,S]);ACTOR=uid;quiet=true;let r;try{r=doAct(a,v,loc)}catch(e){console.error(e);r=false}finally{quiet=false}ACTOR=UID;if(S)ONLINE.me=S.players.findIndex(q=>q.uid===UID);
  if(r!==false&&JSON.stringify([LOB,S])!==before){ONLINE.seq++;persistHost();broadcast()}render()}
async function mutate(a,v,loc){if(busy)return;busy=true;const ref=DB.doc('games2/'+ONLINE.code);
  try{let ok=false;for(let k=0;k<20&&!ok;k++){ok=(await ref.acquire({holder:UID,ttlMs:1500})).acquired;if(!ok)await new Promise(r=>setTimeout(r,300))}if(!ok)throw 0;
    const sn=await ref.get();const d=sn.data();if((d.seq||0)!==ONLINE.seq){ONLINE.seq=d.seq||0;LOB=JSON.parse(JSON.stringify(d.lobby));S=d.state?JSON.parse(JSON.stringify(d.state)):null;say('Гра змінилась, натисни ще раз');return}
    LOB=JSON.parse(JSON.stringify(d.lobby));S=d.state?JSON.parse(JSON.stringify(d.state)):null;ACTOR=UID;quiet=true;let r;try{r=doAct(a,v,loc)}finally{quiet=false}
    if(r===false)return;await ref.set({lobby:LOB,state:S,seq:(d.seq||0)+1});ONLINE.seq=(d.seq||0)+1}
  catch(e){say(e&&e.code==='invalid_argument'?'Немає дозволу: власник має поділитися з тобою як «Contributor».':'Не вдалося, спробуй ще раз')}finally{busy=false;render()}}
function send(a,v){const loc={name:setup.myname||''};
  if(DB)return mutate(a,v,loc);
  if(ONLINE.host)return hostApply(UID,a,v,loc);
  if(CONN&&CONN.open)CONN.send({t:'act',uid:UID,a,v,seq:ONLINE.seq,loc});else say('Немає зв’язку з ведучим')}
function loadPeer(){return new Promise((res,rej)=>{if(window.Peer)return res();const x=document.createElement('script');x.src='https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js';x.onload=res;x.onerror=rej;document.head.appendChild(x)})}
const code4=()=>Array.from({length:4},()=>'ABCDEFGHJKLMNPRSTUVWXYZ'[rnd(23)]).join('');
async function peerHost(code,saved){try{await loadPeer()}catch(e){return say('Не вдалося завантажити модуль зв’язку')}
  ONLINE={code,me:-1,seq:saved?saved.seq:1,host:true};LOB=saved?saved.lobby:{host:UID,players:[{uid:UID,name:setup.myname||'Ведучий'}],opts:{...setup.opts}};S=saved?saved.state:null;persistHost();render();
  const pr=new Peer(PFX+code);PEER=pr;pr.on('open',()=>{ONLINE&&(ONLINE.ready=true);render()});
  pr.on('connection',c=>{c.on('data',m=>{if(!m||typeof m.uid!=='string')return;CONNS.set(m.uid,c);
    if(m.t==='join'){hostApply(m.uid,'join',null,{name:String(m.name||'')});try{c.send(stateMsg())}catch(e){}return}
    if(m.t==='act'){if(m.seq!==ONLINE.seq){try{c.send({...stateMsg(),stale:true})}catch(e){}return}hostApply(m.uid,String(m.a),m.v,m.loc||{});try{c.send(stateMsg())}catch(e){}}});
    c.on('close',()=>{for(const [k,x] of CONNS)if(x===c)CONNS.delete(k)})});
  pr.on('disconnected',()=>{try{pr.reconnect()}catch(e){}});
  pr.on('error',e=>{if(e.type==='unavailable-id'){pr.destroy();setTimeout(()=>ONLINE&&peerHost(saved||S?code:code4(),saved||(S?{lobby:LOB,state:S,seq:ONLINE.seq}:null)),saved||S?3000:0)}})}
async function peerJoin(code){try{await loadPeer()}catch(e){return say('Не вдалося завантажити модуль зв’язку')}
  ONLINE={code,me:-1,seq:0,host:false};LOB=null;S=null;try{localStorage.setItem('myt-online',JSON.stringify({code,name:setup.myname}))}catch(e){}
  const pr=new Peer();PEER=pr;
  const dial=()=>{if(!ONLINE||ONLINE.code!==code)return;const c=pr.connect(PFX+code,{reliable:true});CONN=c;
    c.on('open',()=>c.send({t:'join',uid:UID,name:setup.myname||'Гравець'}));
    c.on('data',m=>{if(m&&m.t==='state'&&ONLINE){ONLINE.lost=false;ONLINE.seq=m.seq;LOB=m.lobby;S=m.state;if(S)ONLINE.me=S.players.findIndex(q=>q.uid===UID);if(m.stale)say('Гра змінилась, натисни ще раз');render()}});
    c.on('close',()=>{if(ONLINE&&ONLINE.code===code){ONLINE.lost=true;render();setTimeout(dial,2500)}})};
  pr.on('open',dial);pr.on('error',e=>{if(e.type==='peer-unavailable'&&!LOB){say('Кімнату не знайдено');leave()}else if(ONLINE){ONLINE.lost=true;render();setTimeout(dial,3000)}});render()}
function connectDB(code){ONLINE={code,me:-1,seq:0};LOB=null;S=null;try{localStorage.setItem('myt-online',JSON.stringify({code,name:setup.myname}))}catch(e){}
  ONLINE.unsub=DB.doc('games2/'+code).onSnapshot(sn=>{if(!ONLINE||ONLINE.code!==code)return;if(!sn.exists){if(!sn.metadata.fromCache){say('Кімнату не знайдено');leave()}return}
    const d=sn.data();ONLINE.seq=d.seq||0;LOB=JSON.parse(JSON.stringify(d.lobby));S=d.state?JSON.parse(JSON.stringify(d.state)):null;if(S)ONLINE.me=S.players.findIndex(q=>q.uid===UID);if(!busy)render()},()=>say('Зв’язок втрачено'));render()}
function leave(){try{ONLINE&&ONLINE.unsub&&ONLINE.unsub()}catch(e){}try{PEER&&PEER.destroy()}catch(e){}PEER=null;CONN=null;CONNS.clear();ONLINE=null;LOB=null;S=null;try{localStorage.removeItem('myt-host');localStorage.removeItem('myt-online')}catch(e){}render()}
const ONL={
  async ocreate(){const nm=(document.getElementById('oname')||{}).value?.trim();if(!nm)return say('Впиши ім’я');setup.myname=nm;const code=code4();
    if(!DB)return peerHost(code,null);
    try{await DB.doc('games2/'+code).set({lobby:{host:UID,players:[{uid:UID,name:nm}],opts:{...setup.opts}},state:null,seq:1})}catch(e){return say('Не вдалося створити гру')}connectDB(code)},
  async ojoin(){const nm=(document.getElementById('oname')||{}).value?.trim(),code=((document.getElementById('ocode')||{}).value||'').trim().toUpperCase();
    if(!nm)return say('Впиши ім’я');if(!/^[A-Z]{4}$/.test(code))return say('Код — 4 літери');setup.myname=nm;
    if(!DB)return peerJoin(code);connectDB(code);for(let k=0;k<40&&ONLINE&&!LOB;k++)await new Promise(r=>setTimeout(r,250));if(LOB)send('join')},
  ostart(){send('ostart')},oleave(){leave()},lopt(v){send('lopt',v)}};
/* ===== Рендер ===== */
function lobbyHTML(){if(!LOB)return `<div class="panel big"><h2>Підключення…</h2><button class="btn g w" data-a="oleave">Вийти</button></div>`;
  const host=LOB.host===UID,o=LOB.opts||setup.opts;return `<div class="hero"><img src="images/banner.webp" alt=""><div class="t"><h1>Кімната ${esc(ONLINE.code)}</h1><p>Скажи код друзям.</p></div></div><div class="panel">${PEERMODE&&ONLINE.host?'<p>Ти ведучий: не закривай сторінку й не блокуй екран.</p>':''}
  <div class="pl">${LOB.players.map(x=>`<div class="pi" style="grid-template-columns:1fr auto"><b>${esc(x.name)}</b>${x.uid===LOB.host?'<span class="mut">створив</span>':''}</div>`).join('')}</div>
  <h3 style="margin-top:12px">Режими</h3>${host?optsHTML(o,'lopt'):OPTS.filter(([k])=>o[k]).map(([,t])=>`<span class="gd">${t}</span> `).join('')||'<span class="mut">класика</span>'}
  ${host?`<button class="btn w" data-a="ostart" style="margin-top:10px" ${LOB.players.length<3?'disabled':''}>${LOB.players.length<3?'Потрібно 3–6 гравців':'Почати гру'}</button>`:'<p class="mut">Гру почне той, хто створив кімнату.</p>'}
  <button class="btn g w" data-a="oleave" style="margin-top:8px">Вийти</button></div>`}
function setupHTML(){return `<div class="hero"><img src="images/banner.webp" alt="Портова митниця"><div class="t"><h1>Митниця</h1><p>Провези товар повз шерифа: обдури, підкупи або будь чесним.</p></div></div>
  <div class="seg"><button class="${mode==='one'?'on':''}" data-a="mode" data-v="one">Один телефон</button><button class="${mode==='many'?'on':''}" data-a="mode" data-v="many">Кожен свій телефон</button></div>
  ${mode==='one'?`<div class="panel"><h3>Купці (3–6)</h3>${setup.names.map((n,i)=>`<div class="nm2" style="margin-top:6px"><input data-i="${i}" value="${esc(n)}" maxlength="14">${setup.names.length>3?`<button data-a="del" data-v="${i}">×</button>`:''}</div>`).join('')}
    ${setup.names.length<6?'<button class="btn g w" data-a="add" style="margin-top:8px">+ Купець</button>':''}<h3 style="margin-top:12px">Режими</h3>${optsHTML(setup.opts,'opt')}<button class="btn w" data-a="start" style="margin-top:12px">Почати гру</button></div>`
  :(!PEERMODE&&!DB?`<div class="panel"><p>Онлайн-режим у Claude потребує входу в акаунт і доступу «Contributor».</p></div>`:`<div class="panel"><h3>Твоє ім’я</h3><input id="oname" maxlength="14" value="${esc(setup.myname||'')}"><button class="btn w" data-a="ocreate" style="margin-top:10px">Створити кімнату</button>
    <h3 style="margin-top:12px">Або приєднатися</h3><div class="nm2"><input id="ocode" maxlength="4" placeholder="Код"><button class="btn" data-a="ojoin" style="width:auto">Увійти</button></div></div>`)}
  <details class="panel"><summary>Правила</summary>${RULES()}</details>`}
function render(){if(quiet)return;bgfx();
  try{if(S&&!ONLINE)localStorage.setItem('mytnytsia2',JSON.stringify(S));if(!S&&!ONLINE)localStorage.removeItem('mytnytsia2')}catch(e){}
  let h='';
  if(ONLINE&&!S)h=lobbyHTML();
  else if(!S)h=setupHTML();
  else if(S.scr==='over')h=overHTML();
  else{h=bar();const me=ONLINE?ONLINE.me:null;
    if(S.scr==='round')h+=`<div class="hero">${vid('v_round')}</div><div class="panel big"><h2>Раунд ${S.round} з ${S.total}</h2><div class="portrait" style="background-image:url(${pav(P(S.sheriff))})"></div><p>Шериф цього раунду: <b class="g">${esc(P(S.sheriff).name)}</b>${P(S.sheriff).ch?` (${CH[P(S.sheriff).ch][0]})`:''}. Інші — купці.</p>
      ${S.ev?`<div class="parch evc" style="text-align:left;margin-top:10px"><img src="${img('e_'+S.ev)}" alt=""><div><h3>Подія: ${EV[S.ev][0]}</h3><p style="margin:0">${EV[S.ev][1]}</p></div></div>`:''}
      ${!ONLINE||me===S.sheriff?'<button class="btn w" data-a="begin" style="margin-top:12px">Відкрити ринок</button>':'<p class="mut">Шериф відкриває ринок.</p>'}</div>`;
    else if(S.scr==='pass'){const p=P(S.q[S.qi]);h+=`<div class="hero">${vid('v_market')}</div><div class="panel big"><p class="mut">Передай телефон купцю</p><div class="portrait" style="background-image:url(${pav(p)})"></div><h2>${esc(p.name)}</h2><p class="mut">Інші не підглядають!</p><button class="btn w" data-a="me">Я — ${esc(p.name)}</button></div>`}
    else if(S.scr==='market'){if(ONLINE){h+=me===S.sheriff?`<div class="hero">${vid('v_market')}</div><div class="panel big"><div class="portrait" style="background-image:url(${img('s_sheriff')})"></div><h2>Ти шериф</h2><p>Купці готують мішки. Дивись на їхні обличчя…</p></div>`:me>=0?marketHTML(me):''}else h+=marketHTML(S.q[S.qi])}
    else if(S.scr==='inspect')h+=inspectHTML();
    h+=`<details class="panel"><summary>Журнал</summary><ul>${S.log.slice(-10).reverse().map(l=>`<li>${esc(l)}</li>`).join('')}</ul></details>`}
  if(ONLINE&&ONLINE.lost)h=`<div class="lost">Зв’язок втрачено, перепідключаюсь…</div>`+h;
  if(dealv&&S&&S.scr==='inspect')h+=dealSheet();
  if(conf)h+=`<div class="ov"><div class="sheet" style="text-align:center"><h3>${conf.m}</h3><div class="row" style="margin-top:12px"><button class="btn g" data-a="cno">Ні</button><button class="btn" data-a="cyes">Так</button></div></div></div>`;
  if(showRules)h+=`<div class="ov"><div class="sheet"><div class="top"><h2>Правила</h2><button class="btn g" data-a="rules">Закрити</button></div>${RULES()}</div></div>`;
  if(toast)h+=`<div class="toast">${esc(toast)}</div>`;
  app.innerHTML=h;
  if(S&&S.players){const g=S.players.map(p=>p.gold);if(prevGold&&prevGold.length===g.length&&app.querySelector)g.forEach((x,i)=>{if(x!==prevGold[i]){const el=app.querySelector(`[data-g="${i}"]`);if(el){el.classList.add('bump');burstAt(el,x>prevGold[i])}}});prevGold=g;
    if(lastFx!==null&&S.fx>lastFx){const r=S.players.map(p=>p.res).find(r=>r&&r.fx===S.fx);sfx(r&&r.t==='liar'?'bad':'coin');
      if(r){if(r.t==='deal')snd('deal');else if(r.t==='honest'||r.t==='liar'){snd('open');snd(r.t==='liar'?'caught':'honest',2600)}}}lastFx=S.fx;
    if(S.scr==='round'&&render.rr!==S.round){if(render.rr!=null)snd('round');render.rr=S.round}
    if((S.scr==='pass'||S.scr==='market')&&render.mr!==S.round){render.mr=S.round;snd('market')}
    if(S.scr==='over'&&!render.won){render.won=1;confetti();sfx('win');snd('win')}if(S.scr!=='over')render.won=0}else{prevGold=null;lastFx=null}}
/* ===== Кліки ===== */
const SETUP={add(){if(setup.names.length<6)setup.names.push('Купець '+(setup.names.length+1))},del(v){setup.names.splice(+v,1)},opt(v){setup.opts[v]=!setup.opts[v]},start(){const n=setup.names.map(s=>s.trim()).filter(Boolean);if(n.length<3)return say('Потрібно 3–6 гравців');newGame(n,setup.opts);hist=[]}};
app.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;let a=b.dataset.a,v=b.dataset.v;
  if(a!=='tog')sfx('tap');
  if(a==='cno'){conf=null;return render()}
  if(a==='cyes'){if(!conf)return;a=conf.a;v=conf.v;conf=null}else if(b.dataset.c){conf={a,v,m:b.dataset.c};return render()}
  if(a==='mute'){muted=!muted;try{localStorage.setItem('myt-mute',muted?'1':'0')}catch(e){}return render()}
  if(a==='mode'){mode=v;return render()}
  if(a==='rules'){showRules=!showRules;return render()}
  if(a==='dealopen'){dealv={i:+v,gold:0,goods:{}};return render()}
  if(a==='dealclose'){dealv=null;return render()}
  if(a==='dg'){dealv.gold=Math.max(0,Math.min(P(dealv.i).gold,dealv.gold+ +v));return render()}
  if(a==='dk'){const [k,d]=v.split('|');dealv.goods[k]=Math.max(0,Math.min(P(dealv.i).stand[k],(dealv.goods[k]||0)+ +d));return render()}
  if(a==='undo'){if(hist.length){S=JSON.parse(hist.pop());sel.clear()}return render()}
  if(!S&&!ONLINE&&SETUP[a]){SETUP[a](v);return render()}
  if(ONL[a]&&(ONLINE||mode==='many'))return ONL[a](v);
  if(a==='deal')dealv=null;
  if(['disc','bag','draw','me','begin'].includes(a))sel.clear();
  if(a==='quit'||a==='again'){if(ONLINE)return a==='quit'?leave():send('again');S=null;hist=[];return render()}
  if(ONLINE&&!LOCAL.has(a))return send(a,v);
  const f=ACT[a];if(!f)return;const before=S?JSON.stringify(S):null;const r=f(v);
  if(r!==false&&before&&S&&JSON.stringify(S)!==before){hist.push(before);if(hist.length>60)hist.shift()}render()});
app.addEventListener('input',e=>{if(e.target.dataset.i!=null)setup.names[+e.target.dataset.i]=e.target.value});
try{render()}catch(err){app.innerHTML='<p>Помилка: '+esc(err.message)+'</p><button class="btn" onclick="localStorage.removeItem(\'mytnytsia2\');location.reload()">Скинути</button>'}
try{const l=document.createElement('link');l.rel='stylesheet';l.href='https://fonts.googleapis.com/css2?family=Kurale&family=Rubik:wght@400;600;800&display=swap';document.head.appendChild(l)}catch(e){}
if(PEERMODE){try{const hs=JSON.parse(localStorage.getItem('myt-host')||'null'),cl=JSON.parse(localStorage.getItem('myt-online')||'null');if(hs&&hs.code){mode='many';setTimeout(()=>peerHost(hs.code,hs),0)}else if(cl&&cl.code){mode='many';setup.myname=cl.name;setTimeout(()=>peerJoin(cl.code),0)}}catch(e){}}
(async()=>{try{if(!window.claude||!window.claude.use)return;DB=await window.claude.use('db');const us=await window.claude.use('user');UID=us?await us.id():null;if(!DB||!UID)DB=null;
  if(DB){const cl=JSON.parse(localStorage.getItem('myt-online')||'null');if(cl&&cl.code){mode='many';setup.myname=cl.name;connectDB(cl.code)}}render()}catch(e){}})();
globalThis.__T={ACT,get S(){return S},set S(v){S=v},newGame,score,sel,setup};
}
